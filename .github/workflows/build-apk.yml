name: Build Medicine Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Diagnose MainActivity and R8
        if: always()
        run: |
          echo "=== gradle.properties ==="
          cat android/gradle.properties || true

          echo "=== MainActivity class files ==="
          find android build -name 'MainActivity*.class' -print 2>/dev/null || true

          echo "=== R8 output files ==="
          find build -type f \( -name 'mapping.txt' -o -name 'usage.txt' -o -name 'seeds.txt' -o -name 'configuration.txt' \) -print 2>/dev/null || true

          echo "=== MainActivity in R8 files ==="
          grep -R -n 'MainActivity\|com.example.medicine_app' build 2>/dev/null | head -100 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Medicine-Assistant-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7